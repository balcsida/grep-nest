openapi: 3.1.0
info:
  title: GrepNest REST API
  version: 0.1.0
paths:
  /v1/account/api-tokens:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Current user's token metadata, content: {application/json: {schema: {$ref: '#/components/schemas/APITokenList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAPITokenRequest'}}}}
      responses:
        '201': {description: Token created; retain token now, it is never returned again, content: {application/json: {schema: {$ref: '#/components/schemas/CreatedAPIToken'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/api-tokens/{id}:
    delete:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Current user's token revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/overview:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Durable service totals, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOverview'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/audit-events:
    get:
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Bounded security audit events, newest first, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded users with effective access and explicit direct assignments, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200': {description: User with effective access and explicit direct assignments, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUser'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/access:
    put:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserAccessRequest'}}}}
      responses:
        '204': {description: Direct user access replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/suspend:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: User suspended and all credentials revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/restore:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: User restored}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/revoke-credentials:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: All user sessions and API tokens revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/groups:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded groups with direct roles and repository grants, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroupList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/groups/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200': {description: Group with direct roles and repository grants, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroup'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/groups/{id}/access:
    put:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccessRequest'}}}}
      responses:
        '204': {description: Direct group access replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/repositories:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded durable repository inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminRepositoryList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/jobs:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        '200': {description: Cursor-paginated indexing job inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminJobList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/scip/uploads:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded SCIP upload inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSCIPUploadList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/scip/dependencies:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded SCIP dependency inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSCIPDependencyList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/webhook-deliveries:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded webhook delivery inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDeliveryList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/github:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Sanitized GitHub App settings and installations, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGitHub'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/repositories/{github_id}/reindex:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: github_id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Current default branch SHA resolved and queued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/reconcile:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '204': {description: GitHub App installations reconciled}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/jobs/{id}/retry:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Current authorized failed job requeued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200':
          description: Authorized repositories and index status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositorySummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories/{id}/status:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized repository index status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositorySummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/files/read:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadFileRequest'}
      responses:
        '200':
          description: Bounded file content at the indexed revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadFileResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '422': {$ref: '#/components/responses/InvalidFile'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/search:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/BackendError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/scip/uploads:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: commit, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      requestBody:
        required: true
        content:
          application/vnd.scip+protobuf:
            schema:
              type: string
              format: binary
              description: Default upload limit is 67108864 bytes; server maximum is 268435456 bytes.
              x-default-max-bytes: 67108864
              x-server-max-bytes: 268435456
      responses:
        '204': {description: SCIP index replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/graph/uploads:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: commit, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      requestBody:
        required: true
        content:
          application/vnd.grepnest.graph.v1+protobuf:
            schema:
              type: string
              format: binary
              description: Default upload limit is 67108864 bytes; server maximum is 268435456 bytes.
              x-default-max-bytes: 67108864
              x-server-max-bytes: 268435456
      responses:
        '204': {description: External graph replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/graph/repositories/{id}/status:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized graph status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphStatus'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/graph/context:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GraphContextRequest'}}}}
      responses:
        '200': {description: Context result; status is found, not_found, or ambiguous, content: {application/json: {schema: {$ref: '#/components/schemas/GraphContextResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/GraphConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/graph/impact:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GraphImpactRequest'}}}}
      responses:
        '200': {description: Impact result; status is found, not_found, or ambiguous, content: {application/json: {schema: {$ref: '#/components/schemas/GraphImpactResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/GraphConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/graph/trace:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GraphTraceRequest'}}}}
      responses:
        '200': {description: Trace result; status is ok, no_path, or ambiguous, content: {application/json: {schema: {$ref: '#/components/schemas/GraphTraceResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/GraphConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/graph/cypher:
    post:
      security: [{bearerAuth: []}]
      description: Administrator-only read-only Cypher. Results are constrained by row and encoded-output limits.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GraphCypherRequest'}}}}
      responses:
        '200': {description: Bounded tabular Cypher result, content: {application/json: {schema: {$ref: '#/components/schemas/GraphCypherResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/GraphConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/scip/navigation:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SCIPNavigationRequest'}
      responses:
        '200':
          description: Authorized SCIP locations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SCIPNavigationResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/scip/dependencies:
    put:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SCIPDependenciesRequest'}
      responses:
        '204': {description: Manual package metadata replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/scip/dependencies/github:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SCIPRepositoryRequest'}
      responses:
        '200':
          description: GitHub dependency metadata refresh result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SCIPDependencyRefreshResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/config:
    get:
      responses:
        '200':
          description: Token login availability and configured OIDC providers
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthConfig'}}}
  /v1/auth/session:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Current authentication method, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /auth/logout:
    post:
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Session cookie cleared}
  /auth/local:
    post:
      description: Disabled-by-default administrator recovery login.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LocalLoginRequest'}}}
      responses:
        '204': {description: Standard session cookie issued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '429': {description: Login throttled, headers: {Retry-After: {schema: {type: integer, minimum: 1, maximum: 900}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /auth/local/rotate:
    post:
      description: Required password rotation for an eligible recovery administrator.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LocalRotationRequest'}}}
      responses:
        '204': {description: Password rotated and a fresh standard session cookie issued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '429': {description: Login throttled, headers: {Retry-After: {schema: {type: integer, minimum: 1, maximum: 900}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/oidc/login:
    get:
      responses: {'303': {description: Redirect to configured OIDC provider}}
  /auth/oidc/callback:
    get:
      responses: {'303': {description: Redirect to the console}}
  /healthz:
    get:
      responses:
        '200': {description: Process is live, content: {text/plain: {schema: {type: string, example: "ok\\n"}}}}
  /readyz:
    get:
      responses:
        '200': {description: Configured dependencies are ready, content: {text/plain: {schema: {type: string, example: "ok\\n"}}}}
        '503':
          description: A configured dependency is unavailable
          content: {application/json: {schema: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string, const: unavailable}}}}}
  /metrics:
    get:
      responses:
        '200': {description: Prometheus metrics, content: {text/plain: {schema: {type: string}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: __Host-grepnest_session, description: Browser session; unsafe methods require the exact configured public Origin.}
  responses:
    InvalidRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    GraphConflict: {description: Graph request conflict; error code is ambiguous, branch_not_indexed, or graph_not_ready, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthenticated: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Administrator access required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AccountForbidden: {description: Account token request is not permitted for this durable principal or repository ceiling, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AdminNotFound: {description: Administrative identity resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AdminConflict: {description: Change would remove the caller or final active effective administrator, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Repository not found or not authorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Repository is not indexed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InvalidFile: {description: File cannot be returned, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BackendError: {description: Search backend failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unavailable: {description: Service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Timeout: {description: Search timed out, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    APIToken:
      type: object
      additionalProperties: false
      required: [id, prefix, created_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        prefix: {type: string}
        repository_ids: {type: array, maxItems: 100, items: {type: integer, format: int64, minimum: 1}}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    APITokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties: {tokens: {type: array, items: {$ref: '#/components/schemas/APIToken'}}}
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      description: Expiry and repository restriction are optional for ordinary users. Administrator tokens require a non-empty repository restriction. Supplied expiry may be at most 90 days after creation.
      properties:
        expires_at: {type: string, format: date-time, description: Optional UTC expiry no more than 90 days after creation.}
        repository_ids: {type: array, maxItems: 100, uniqueItems: true, description: Optional ceiling for ordinary users and required non-empty ceiling for administrators., items: {type: integer, format: int64, minimum: 1}}
    CreatedAPIToken:
      type: object
      additionalProperties: false
      required: [id, prefix, created_at, token]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        prefix: {type: string}
        repository_ids: {type: array, maxItems: 100, items: {type: integer, format: int64, minimum: 1}}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        token: {type: string}
    AuthConfig:
      type: object
      additionalProperties: false
      required: [token_login, break_glass, file_reads, providers]
      properties:
        token_login: {type: boolean}
        break_glass: {type: boolean}
        file_reads: {type: boolean}
        providers: {type: array, items: {type: object, additionalProperties: false, required: [id, label, login_url], properties: {id: {type: string}, label: {type: string}, login_url: {type: string}}}}
    AuthSession:
      type: object
      additionalProperties: false
      required: [method]
      properties: {method: {type: string, enum: [bearer, oidc, local]}}
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [user_name, password]
      properties:
        user_name: {type: string}
        password: {type: string}
    LocalRotationRequest:
      type: object
      additionalProperties: false
      required: [user_name, current_password, new_password]
      properties:
        user_name: {type: string}
        current_password: {type: string}
        new_password: {type: string, minLength: 16, maxLength: 1024}
    AdminAccessRequest:
      type: object
      additionalProperties: false
      required: [administrator, repository_ids]
      properties:
        administrator: {type: boolean}
        repository_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    AdminUserAccessRequest:
      type: object
      additionalProperties: false
      required: [direct_administrator, direct_repository_ids]
      properties:
        direct_administrator: {type: boolean}
        direct_repository_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    AdminUserList:
      type: object
      additionalProperties: false
      required: [users, truncated]
      properties:
        users: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminUser'}}
        truncated: {type: boolean}
    AuditEventList:
      type: object
      additionalProperties: false
      required: [events, truncated]
      properties:
        events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AuditEvent'}}
        truncated: {type: boolean}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [actor_type, actor_id, target_type, target_id, authentication_method, operation, outcome, request_id, created_at]
      properties:
        actor_type: {type: string, enum: [anonymous, operator, scim, system, user]}
        actor_id: {type: string, maxLength: 128}
        target_type: {type: string, enum: [api_token, authentication, group, session, user]}
        target_id: {type: string, maxLength: 128}
        authentication_method: {type: string, enum: ['', api_token, local, oidc, operator, scim_token]}
        operation:
          type: string
          enum: [oidc_login_succeeded, oidc_login_denied, local_login_succeeded, local_login_denied, logout, session_created, session_revoked, api_token_created, api_token_use_rejected, api_token_revoked, password_set, password_rotated, break_glass_password_set, user_suspended, user_restored, user_credentials_revoked, scim_user_created, scim_user_replaced, scim_user_patched, scim_user_deactivated, scim_user_deleted, scim_group_created, scim_group_replaced, scim_group_patched, scim_group_deleted, group_membership_changed, group_role_changed, group_repository_grant_changed, user_role_changed, user_repository_grant_changed, admin_mutation_denied]
        outcome: {type: string, enum: [success, denied, invalid, error]}
        request_id: {type: string, maxLength: 128}
        created_at: {type: string, format: date-time}
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, external_id, user_name, display_name, source, scim_active, suspended, administrator, repository_ids, direct_administrator, direct_repository_ids]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        external_id: {type: string, readOnly: true}
        user_name: {type: string, readOnly: true}
        display_name: {type: string, readOnly: true}
        source: {type: string, enum: [scim, local], readOnly: true}
        scim_active: {type: boolean, readOnly: true}
        suspended: {type: boolean}
        administrator: {type: boolean}
        repository_ids: {type: array, maxItems: 100, items: {type: integer, format: int64, minimum: 1}}
        direct_administrator: {type: boolean}
        direct_repository_ids: {type: array, maxItems: 100, items: {type: integer, format: int64, minimum: 1}}
    AdminGroupList:
      type: object
      additionalProperties: false
      required: [groups, truncated]
      properties:
        groups: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminGroup'}}
        truncated: {type: boolean}
    AdminGroup:
      type: object
      additionalProperties: false
      required: [id, external_id, display_name, administrator, repository_ids, member_count]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        external_id: {type: string, readOnly: true}
        display_name: {type: string, readOnly: true}
        administrator: {type: boolean}
        repository_ids: {type: array, maxItems: 100, items: {type: integer, format: int64, minimum: 1}}
        member_count: {type: integer, minimum: 0, readOnly: true}
    AdminOverview:
      type: object
      additionalProperties: false
      required: [repositories, jobs, deliveries, scip_uploads, dependencies, installations]
      properties:
        repositories: {type: object, additionalProperties: {type: integer, format: int64}}
        jobs: {type: object, additionalProperties: {type: integer, format: int64}}
        deliveries: {type: object, additionalProperties: {type: integer, format: int64}}
        scip_uploads: {type: integer, format: int64}
        dependencies: {type: integer, format: int64}
        installations: {type: integer, format: int64}
    AdminRepositoryList:
      type: object
      additionalProperties: false
      required: [repositories, truncated]
      properties:
        repositories: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminRepository'}}
        truncated: {type: boolean}
    AdminRepository:
      type: object
      additionalProperties: false
      required: [id, github_id, installation_id, name, default_branch, desired_sha, indexed_sha, status, error_code, web_url, enabled, private, archived]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        github_id: {type: integer, format: int64, minimum: 1}
        installation_id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        default_branch: {type: string}
        desired_sha: {type: string}
        indexed_sha: {type: string}
        status: {type: string, enum: [pending, ready, failed, disabled]}
        error_code: {type: string}
        web_url: {type: string, format: uri}
        enabled: {type: boolean}
        private: {type: boolean}
        archived: {type: boolean}
        last_indexed_at: {type: string, format: date-time}
    AdminJobList:
      type: object
      additionalProperties: false
      required: [jobs, truncated]
      properties:
        jobs: {type: array, maxItems: 25, items: {$ref: '#/components/schemas/AdminJob'}}
        truncated: {type: boolean}
        next_cursor: {type: string, minLength: 1}
    AdminJob:
      type: object
      additionalProperties: false
      required: [id, repository_id, repository, target_sha, target_ref, reason, state, error_code, attempt, max_attempts, priority, run_after, created_at, updated_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        repository_id: {type: integer, format: int64, minimum: 1}
        repository: {type: string}
        target_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
        target_ref: {type: string}
        reason: {type: string}
        state: {type: string, enum: [queued, running, succeeded, failed, superseded]}
        error_code: {type: string}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, maximum: 5}
        priority: {type: integer}
        run_after: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminSCIPUploadList:
      type: object
      additionalProperties: false
      required: [uploads, truncated]
      properties:
        uploads: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminSCIPUpload'}}
        truncated: {type: boolean}
    AdminSCIPUpload:
      type: object
      additionalProperties: false
      required: [id, repository_id, repository, commit, project_root, indexer_name, indexer_version, uploaded_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        repository_id: {type: integer, format: int64, minimum: 1}
        repository: {type: string}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        project_root: {type: string}
        indexer_name: {type: string}
        indexer_version: {type: string}
        uploaded_at: {type: string, format: date-time}
    AdminSCIPDependencyList:
      type: object
      additionalProperties: false
      required: [dependencies, truncated]
      properties:
        dependencies: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminSCIPDependency'}}
        truncated: {type: boolean}
    AdminSCIPDependency:
      type: object
      additionalProperties: false
      required: [repository_id, repository, source, relation, purl, manager, name, version]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        repository: {type: string}
        source: {type: string, enum: [manual, github]}
        relation: {type: string, enum: [provides, depends_on]}
        purl: {type: string}
        manager: {type: string}
        name: {type: string}
        version: {type: string}
    AdminDeliveryList:
      type: object
      additionalProperties: false
      required: [deliveries, truncated]
      properties:
        deliveries: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminDelivery'}}
        truncated: {type: boolean}
    AdminDelivery:
      type: object
      additionalProperties: false
      required: [id, delivery_id, event, state, error_code, installation_id, received_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        delivery_id: {type: string}
        event: {type: string}
        state: {type: string}
        error_code: {type: string}
        installation_id: {type: integer, format: int64, minimum: 1}
        received_at: {type: string, format: date-time}
        processed_at: {type: string, format: date-time}
    AdminGitHub:
      type: object
      additionalProperties: false
      required: [app_id, web_url, api_url, upload_url, git_url, api_version, private_key_configured, webhook_secret_configured, ca_configured, installations, truncated]
      properties:
        app_id: {type: integer, format: int64}
        web_url: {type: string, format: uri}
        api_url: {type: string, format: uri}
        upload_url: {type: string, format: uri}
        git_url: {type: string, format: uri}
        api_version: {type: string}
        private_key_configured: {type: boolean}
        webhook_secret_configured: {type: boolean}
        ca_configured: {type: boolean}
        installations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminInstallation'}}
        truncated: {type: boolean}
    AdminInstallation:
      type: object
      additionalProperties: false
      required: [github_id, account_login, account_type, status]
      properties:
        github_id: {type: integer, format: int64, minimum: 1}
        account_login: {type: string}
        account_type: {type: string}
        status: {type: string}
        suspended_at: {type: string, format: date-time}
    RepositoryList:
      type: object
      additionalProperties: false
      required: [repositories, truncated]
      properties:
        repositories: {type: array, items: {$ref: '#/components/schemas/RepositorySummary'}}
        truncated: {type: boolean}
    RepositorySummary:
      type: object
      additionalProperties: false
      required: [id, github_id, name, branch, desired_sha, indexed_sha, web_url, status, error_code, search_node]
      properties:
        id: {type: integer, format: int64}
        github_id: {type: integer, format: int64}
        name: {type: string}
        branch: {type: string}
        desired_sha: {type: string}
        indexed_sha: {type: string}
        web_url: {type: string, format: uri}
        status: {type: string}
        error_code: {type: string}
        search_node: {type: string}
        last_indexed_at: {type: string, format: date-time}
    GraphStatus:
      type: object
      additionalProperties: false
      required: [repository_id, state]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        state: {type: string, enum: [not_indexed, pending, fallback, degraded, ready]}
        source: {type: string, enum: [managed, external]}
        job_state: {type: string, enum: [queued, running, succeeded, failed, superseded]}
        error_code: {type: string}
        scip_fallback: {$ref: '#/components/schemas/SCIPFallbackStatus'}
    GraphRepositorySelector:
      oneOf:
        - {type: integer, format: int64, minimum: 1}
        - {type: string, minLength: 1}
    GraphContextRequest:
      type: object
      additionalProperties: false
      properties:
        repo: {$ref: '#/components/schemas/GraphRepositorySelector'}
        uid: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        file_path: {type: string}
        kind: {type: string}
        branch: {type: string, description: Only the current indexed default branch is supported.}
        relations: {type: array, items: {type: string, enum: [calls, references, extends, implements]}}
        per_category_limit: {type: integer, minimum: 0, default: 100, description: Values greater than 100 are capped to 100.}
        per_category_offset: {type: integer, minimum: 0}
        include_content: {type: boolean}
      oneOf: [{required: [uid]}, {required: [name]}]
    GraphImpactRequest:
      type: object
      additionalProperties: false
      required: [target_uid, direction]
      properties:
        repo: {$ref: '#/components/schemas/GraphRepositorySelector'}
        branch: {type: string, description: Only the current indexed default branch is supported.}
        target_uid: {type: string, minLength: 1}
        direction: {type: string, enum: [upstream, downstream]}
        relations: {type: array, items: {type: string, enum: [calls, references, extends, implements]}}
        min_confidence: {type: number, minimum: 0, maximum: 1}
        include_tests: {type: boolean}
        max_depth: {type: integer, minimum: 0, default: 3, description: Values greater than 32 are capped to 32.}
        limit: {type: integer, minimum: 0, default: 100, description: Values greater than 100 are capped to 100.}
        offset: {type: integer, minimum: 0}
        summary_only: {type: boolean}
    GraphTraceRequest:
      type: object
      additionalProperties: false
      required: [source_uid, target_uid]
      properties:
        repo: {$ref: '#/components/schemas/GraphRepositorySelector'}
        branch: {type: string, description: Only the current indexed default branch is supported.}
        source_uid: {type: string, minLength: 1}
        target_uid: {type: string, minLength: 1}
        max_depth: {type: integer, minimum: 0, default: 10, description: Values greater than 30 are capped to 30.}
    GraphCypherRequest:
      type: object
      additionalProperties: false
      required: [statement]
      properties:
        repo: {$ref: '#/components/schemas/GraphRepositorySelector'}
        branch: {type: string, description: Only the current indexed default branch is supported.}
        statement: {type: string, minLength: 1}
        parameters: {type: object, additionalProperties: {}}
        max_rows: {type: integer, minimum: 0, default: 100, description: Values greater than 100 are capped to 100.}
        max_bytes: {type: integer, format: int64, minimum: 0, default: 262144, description: Values greater than 262144 are capped to 262144.}
    GraphPosition:
      type: object
      additionalProperties: false
      required: [start_line, start_character, end_line, end_character]
      properties:
        start_line: {type: integer, minimum: 0}
        start_character: {type: integer, minimum: 0}
        end_line: {type: integer, minimum: 0}
        end_character: {type: integer, minimum: 0}
    GraphSymbol:
      type: object
      additionalProperties: false
      required: [uid, name, kind, file_path, language, repository_id, range, test]
      properties:
        uid: {type: string}
        name: {type: string}
        kind: {type: string}
        file_path: {type: string}
        language: {type: string}
        signature: {type: string}
        repository_id: {type: integer, format: int64}
        range: {$ref: '#/components/schemas/GraphPosition'}
        test: {type: boolean}
        content: {type: string}
    GraphCandidate:
      type: object
      additionalProperties: false
      required: [uid, name, kind, file_path, repository_id, line, score]
      properties:
        uid: {type: string}
        name: {type: string}
        kind: {type: string}
        file_path: {type: string}
        repository_id: {type: integer, format: int64, minimum: 1, description: GitHub repository ID accepted by repo}
        line: {type: integer}
        score: {type: number}
    GraphReference:
      type: object
      additionalProperties: false
      required: [source_repository_id, target_repository_id, source_uid, target_uid, kind, range, confidence]
      properties:
        source_repository_id: {type: integer, format: int64}
        target_repository_id: {type: integer, format: int64}
        source_uid: {type: string}
        target_uid: {type: string}
        kind: {type: string}
        path: {type: string}
        range: {$ref: '#/components/schemas/GraphPosition'}
        confidence: {type: number}
        resolution_reason: {type: string}
    GraphBoundary:
      type: object
      additionalProperties: false
      required: [reason]

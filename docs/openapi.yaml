    GraphContextFoundResponse:
      type: object
      additionalProperties: false
      required: [status, symbol, commits]
      properties:
        status: {type: string, const: found}
        symbol: {$ref: '#/components/schemas/GraphSymbol'}
        incoming: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}}
        outgoing: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    GraphContextNotFoundResponse:
      type: object
      additionalProperties: false
      required: [status, commits]
      properties:
        status: {type: string, const: not_found}
        incoming: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}}
        outgoing: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    GraphContextAmbiguousResponse:
      type: object
      additionalProperties: false
      required: [status, candidates, commits]
      properties:
        status: {type: string, const: ambiguous}
        candidates: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GraphCandidate'}}
        incoming: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}}
        outgoing: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    GraphImpactResponse:
      oneOf:
        - {$ref: '#/components/schemas/GraphImpactFoundResponse'}
        - {$ref: '#/components/schemas/GraphImpactNotFoundResponse'}
        - {$ref: '#/components/schemas/GraphImpactAmbiguousResponse'}
      discriminator: {propertyName: status}
    GraphImpactFoundResponse:
      type: object
      additionalProperties: false
      required: [status, by_depth, commits, partial]
      properties:
        status: {type: string, const: found}
        by_depth: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphSymbol'}}}
        relations: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
        partial: {type: boolean}
    GraphImpactNotFoundResponse:
      type: object
      additionalProperties: false
      required: [status, by_depth, commits, partial]
      properties:
        status: {type: string, const: not_found}
        by_depth: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphSymbol'}}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
        partial: {type: boolean}
    GraphImpactAmbiguousResponse:
      type: object
      additionalProperties: false
      required: [status, candidates, by_depth, commits, partial]
      properties:
        status: {type: string, const: ambiguous}
        candidates: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GraphCandidate'}}
        by_depth: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/GraphSymbol'}}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
        partial: {type: boolean}
    GraphTraceResponse:
      oneOf:
        - {$ref: '#/components/schemas/GraphTraceOKResponse'}
        - {$ref: '#/components/schemas/GraphTraceNoPathResponse'}
        - {$ref: '#/components/schemas/GraphTraceAmbiguousResponse'}
      discriminator: {propertyName: status}
    GraphTraceOKResponse:
      type: object
      additionalProperties: false
      required: [status, nodes, commits]
      properties:
        status: {type: string, const: ok}
        nodes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GraphSymbol'}}
        relations: {type: array, items: {$ref: '#/components/schemas/GraphReference'}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    GraphTraceNoPathResponse:
      type: object
      additionalProperties: false
      required: [status, commits]
      properties:
        status: {type: string, const: no_path}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    GraphTraceAmbiguousResponse:
      type: object
      additionalProperties: false
      required: [status, candidates, commits]
      properties:
        status: {type: string, const: ambiguous}
        candidates: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GraphCandidate'}}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    GraphCypherResponse:
      type: object
      additionalProperties: false
      required: [status, columns, rows, truncated, commits]
      properties:
        status: {type: string, const: ok}
        columns: {type: array, items: {type: string}}
        rows: {type: array, items: {type: array, items: {}}}
        truncated: {type: boolean}
        boundaries: {type: array, items: {$ref: '#/components/schemas/GraphBoundary'}}
        commits: {type: object, additionalProperties: {type: string, pattern: '^[0-9a-f]{40}$'}}
    SCIPFallbackStatus:
      type: object
      additionalProperties: false
      required: [commit]
      properties:
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
    ReadFileRequest:
      type: object
      additionalProperties: false
      required: [repository_id, path]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        path: {type: string, minLength: 1}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    ReadFileResponse:
      type: object
      additionalProperties: false
      required: [repository_id, path, indexed_sha, blob_sha, content, start_line, end_line, truncated]
      properties:
        repository_id: {type: integer, format: int64}
        path: {type: string}
        indexed_sha: {type: string}
        blob_sha: {type: string}
        content: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
        truncated: {type: boolean}
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string}
        repositories: {type: array, items: {type: string}}
        limit: {type: integer}
        context_lines: {type: integer}
        timeout: {type: integer, description: Go duration in nanoseconds}
        max_response_bytes: {type: integer, format: int64}
    SearchResponse:
      type: object
      additionalProperties: false
      required: [matches, truncated]
      properties:
        matches: {type: array, items: {$ref: '#/components/schemas/SearchMatch'}}
        truncated: {type: boolean}
    SearchMatch:
      type: object
      additionalProperties: false
      required: [repository, path, sha, line_number, line_start, line_end, preview, score]
      properties:
        repository: {$ref: '#/components/schemas/Repository'}
        path: {type: string}
        sha: {type: string}
        line_number: {type: integer, description: One-based source line used for repository-host anchors}
        line_start: {type: integer}
        line_end: {type: integer}
        preview: {type: string}
        score: {type: number, format: double}
    SCIPNavigationRequest:
      type: object
      additionalProperties: false
      required: [repository_id, path, line, operation]
      oneOf:
        - required: [character_utf8, character_utf16, character_utf32]
        - not:
            anyOf:
              - required: [character_utf8]
              - required: [character_utf16]
              - required: [character_utf32]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        path: {type: string, minLength: 1, description: Clean relative slash-separated path}
        commit: {type: string, pattern: '^[0-9a-f]{40}$', description: Optional indexed commit; stale supplied commits are rejected}
        line: {type: integer, minimum: 1, maximum: 2147483647, description: One-based source line}
        character: {type: integer, minimum: 0, maximum: 2147483647, default: 0, description: Legacy offset applied to every position encoding}
        character_utf8: {type: integer, minimum: 0, maximum: 2147483647, description: UTF-8 code-unit offset; provide with character_utf16 and character_utf32}
        character_utf16: {type: integer, minimum: 0, maximum: 2147483647, description: UTF-16 code-unit offset; provide with character_utf8 and character_utf32}
        character_utf32: {type: integer, minimum: 0, maximum: 2147483647, description: UTF-32 code-unit offset; provide with character_utf8 and character_utf16}
        operation: {type: string, enum: [definitions, references, implementations]}
    SCIPNavigationResponse:
      type: object
      additionalProperties: false
      required: [locations, truncated]
      properties:
        locations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SCIPLocation'}}
        truncated: {type: boolean}
    SCIPLocation:
      type: object
      additionalProperties: false
      required: [repository_id, repository_name, branch, web_url, commit, path, symbol, start_line, start_character, end_line, end_character, position_encoding, roles, approximate]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        repository_name: {type: string}
        branch: {type: string}
        web_url: {type: string, format: uri}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        path: {type: string}
        symbol: {type: string}
        start_line: {type: integer, minimum: 1}
        start_character: {type: integer, minimum: 0}
        end_line: {type: integer, minimum: 1}
        end_character: {type: integer, minimum: 0}
        position_encoding: {type: string, enum: [UTF8CodeUnitOffsetFromLineStart, UTF16CodeUnitOffsetFromLineStart, UTF32CodeUnitOffsetFromLineStart]}
        roles: {type: integer, format: int32}
        approximate: {type: boolean}
    SCIPDependenciesRequest:
      type: object
      additionalProperties: false
      required: [repository_id]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        provides: {type: array, items: {type: string, minLength: 1}}
        depends_on: {type: array, items: {type: string, minLength: 1}}
    SCIPRepositoryRequest:
      type: object
      additionalProperties: false
      required: [repository_id]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
    SCIPDependencyRefreshResponse:
      type: object
      additionalProperties: false
      required: [available, packages]
      properties:
        available: {type: boolean}
        packages: {type: integer, minimum: 0}
    Repository:
      type: object
      additionalProperties: false
      required: [id, name, branch, indexed_sha, web_url]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        branch: {type: string}
        indexed_sha: {type: string}
        web_url: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            retryable: {type: boolean}

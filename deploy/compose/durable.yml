services:
  grepnest-indexer:
    profiles: [durable]
    image: ${GREPNEST_NODE_IMAGE:?GREPNEST_NODE_IMAGE is required}
    entrypoint: ["grepnest-indexer"]
    depends_on:
      postgres:
        condition: service_healthy
      zoekt-durable:
        condition: service_healthy
    environment:
      GREPNEST_DATABASE_URL: postgres://grepnest:grepnest@postgres:5432/grepnest?sslmode=disable
      GREPNEST_ZOEKT_URL: http://zoekt-durable:6070
      GREPNEST_GITHUB_WEB_URL: ${GREPNEST_GITHUB_WEB_URL:?GREPNEST_GITHUB_WEB_URL is required}
      GREPNEST_GITHUB_API_URL: ${GREPNEST_GITHUB_API_URL:?GREPNEST_GITHUB_API_URL is required}
      GREPNEST_GITHUB_UPLOAD_URL: ${GREPNEST_GITHUB_UPLOAD_URL:?GREPNEST_GITHUB_UPLOAD_URL is required}
      GREPNEST_GITHUB_GIT_URL: ${GREPNEST_GITHUB_GIT_URL:?GREPNEST_GITHUB_GIT_URL is required}
      GREPNEST_GITHUB_APP_ID: ${GREPNEST_GITHUB_APP_ID:?GREPNEST_GITHUB_APP_ID is required}
      GREPNEST_GITHUB_CA_FILE: ${GREPNEST_GITHUB_CA_FILE:+/run/secrets/grepnest/github-ca.pem}
      GREPNEST_GITHUB_PRIVATE_KEY_FILE: /run/secrets/grepnest/private-key.pem
      GREPNEST_DATA_DIR: /var/lib/grepnest/data
      GREPNEST_INDEX_DIR: /var/lib/grepnest/index
      GREPNEST_GIT_PATH: /usr/bin/git
      GREPNEST_ZOEKT_GIT_INDEX: /usr/bin/zoekt-git-index
      GREPNEST_WORKER_ID: primary
      GREPNEST_MIN_FREE_BYTES: 1073741824
    volumes:
      - grepnest-data:/var/lib/grepnest/data
      - ../../.cache/durable-index:/var/lib/grepnest/index
      - type: bind
        source: ${GREPNEST_GITHUB_PRIVATE_KEY_FILE:?GREPNEST_GITHUB_PRIVATE_KEY_FILE is required}
        target: /run/secrets/grepnest/private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_GITHUB_CA_FILE:-/dev/null}
        target: /run/secrets/grepnest/github-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]

  grepnest-scanner:
    profiles: [durable]
    image: ${GREPNEST_NODE_IMAGE:?GREPNEST_NODE_IMAGE is required}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["GREPNEST_WORKER_ID=$(hostname) exec grepnest-scanner"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: ${GREPNEST_SCANNER_REPLICAS:-2}
    environment:
      GREPNEST_DATABASE_URL: postgres://grepnest:grepnest@postgres:5432/grepnest?sslmode=disable
      GREPNEST_GITHUB_WEB_URL: ${GREPNEST_GITHUB_WEB_URL:?GREPNEST_GITHUB_WEB_URL is required}
      GREPNEST_GITHUB_API_URL: ${GREPNEST_GITHUB_API_URL:?GREPNEST_GITHUB_API_URL is required}
      GREPNEST_GITHUB_UPLOAD_URL: ${GREPNEST_GITHUB_UPLOAD_URL:?GREPNEST_GITHUB_UPLOAD_URL is required}
      GREPNEST_GITHUB_GIT_URL: ${GREPNEST_GITHUB_GIT_URL:?GREPNEST_GITHUB_GIT_URL is required}
      GREPNEST_GITHUB_APP_ID: ${GREPNEST_GITHUB_APP_ID:?GREPNEST_GITHUB_APP_ID is required}
      GREPNEST_GITHUB_CA_FILE: ${GREPNEST_GITHUB_CA_FILE:+/run/secrets/grepnest/github-ca.pem}
      GREPNEST_GITHUB_PRIVATE_KEY_FILE: /run/secrets/grepnest/private-key.pem
      GREPNEST_DATA_DIR: /var/lib/grepnest/data
      GREPNEST_GIT_PATH: /usr/bin/git
    tmpfs:
      - /var/lib/grepnest
    volumes:
      - type: bind
        source: ${GREPNEST_GITHUB_PRIVATE_KEY_FILE:?GREPNEST_GITHUB_PRIVATE_KEY_FILE is required}
        target: /run/secrets/grepnest/private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_GITHUB_CA_FILE:-/dev/null}
        target: /run/secrets/grepnest/github-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]

  grepnest-server:
    profiles: [durable]
    image: ${GREPNEST_APPLICATION_IMAGE:?GREPNEST_APPLICATION_IMAGE is required}
    entrypoint: ["grepnest-server"]
    depends_on:
      postgres:
        condition: service_healthy
      zoekt-durable:
        condition: service_healthy
    environment:
      GREPNEST_DATABASE_URL: postgres://grepnest:grepnest@postgres:5432/grepnest?sslmode=disable
      GREPNEST_ZOEKT_URL: http://zoekt-durable:6070
      GREPNEST_GITHUB_WEB_URL: ${GREPNEST_GITHUB_WEB_URL:?GREPNEST_GITHUB_WEB_URL is required}
      GREPNEST_GITHUB_API_URL: ${GREPNEST_GITHUB_API_URL:?GREPNEST_GITHUB_API_URL is required}
      GREPNEST_GITHUB_UPLOAD_URL: ${GREPNEST_GITHUB_UPLOAD_URL:?GREPNEST_GITHUB_UPLOAD_URL is required}
      GREPNEST_GITHUB_GIT_URL: ${GREPNEST_GITHUB_GIT_URL:?GREPNEST_GITHUB_GIT_URL is required}
      GREPNEST_GITHUB_APP_ID: ${GREPNEST_GITHUB_APP_ID:?GREPNEST_GITHUB_APP_ID is required}
      GREPNEST_GITHUB_CA_FILE: ${GREPNEST_GITHUB_CA_FILE:+/run/secrets/grepnest/github-ca.pem}
      GREPNEST_GITHUB_PRIVATE_KEY_FILE: /run/secrets/grepnest/private-key.pem
      GREPNEST_GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/grepnest/webhook-secret
      GREPNEST_SCIP_MAX_UPLOAD_BYTES: ${GREPNEST_SCIP_MAX_UPLOAD_BYTES:-67108864}
      GREPNEST_PUBLIC_URL: ${GREPNEST_PUBLIC_URL:-}
      GREPNEST_SSO_SESSION_IDLE: ${GREPNEST_SSO_SESSION_IDLE:-}
      GREPNEST_SSO_SESSION_TTL: ${GREPNEST_SSO_SESSION_TTL:-}
      GREPNEST_SSO_LOGIN_FLOW_TTL: ${GREPNEST_SSO_LOGIN_FLOW_TTL:-}
      GREPNEST_OIDC_ISSUER_URL: ${GREPNEST_OIDC_ISSUER_URL:-}
      GREPNEST_OIDC_CLIENT_ID: ${GREPNEST_OIDC_CLIENT_ID:-}
      GREPNEST_OIDC_CLIENT_SECRET_FILE: ${GREPNEST_OIDC_CLIENT_SECRET_FILE:+/run/secrets/grepnest/oidc-client-secret}
      GREPNEST_OIDC_CA_FILE: ${GREPNEST_OIDC_CA_FILE:+/run/secrets/grepnest/oidc-ca.pem}
      GREPNEST_OIDC_SCOPES: ${GREPNEST_OIDC_SCOPES:-}
      GREPNEST_OIDC_LINK_CLAIM: ${GREPNEST_OIDC_LINK_CLAIM:-}
      GREPNEST_OIDC_DISPLAY_NAME_CLAIM: ${GREPNEST_OIDC_DISPLAY_NAME_CLAIM:-}
      GREPNEST_OAUTH_GITHUB_CLIENT_ID: ${GREPNEST_OAUTH_GITHUB_CLIENT_ID:-}
      GREPNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE: ${GREPNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE:+/run/secrets/grepnest/oauth-github-client-secret}
      GREPNEST_SCIM_TOKEN_FILE: ${GREPNEST_SCIM_TOKEN_FILE:+/run/secrets/grepnest/scim/token}
      GREPNEST_BREAK_GLASS_ENABLED: ${GREPNEST_BREAK_GLASS_ENABLED:-false}
    volumes:
      - type: bind
        source: ${GREPNEST_GITHUB_PRIVATE_KEY_FILE:?GREPNEST_GITHUB_PRIVATE_KEY_FILE is required}
        target: /run/secrets/grepnest/private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_GITHUB_WEBHOOK_SECRET_FILE:?GREPNEST_GITHUB_WEBHOOK_SECRET_FILE is required}
        target: /run/secrets/grepnest/webhook-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_GITHUB_CA_FILE:-/dev/null}
        target: /run/secrets/grepnest/github-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_OIDC_CLIENT_SECRET_FILE:-/dev/null}
        target: /run/secrets/grepnest/oidc-client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_OIDC_CA_FILE:-/dev/null}
        target: /run/secrets/grepnest/oidc-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE:-/dev/null}
        target: /run/secrets/grepnest/oauth-github-client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GREPNEST_SCIM_TOKEN_FILE:-/dev/null}
        target: /run/secrets/grepnest/scim/token
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [internal, loopback]

volumes:
  grepnest-data:

nameOverride: ""
fullnameOverride: ""
images:
  application: {repository: "", digest: "", tag: "", pullPolicy: IfNotPresent}
  node: {repository: "", digest: "", tag: "", pullPolicy: IfNotPresent}
  scanner: {repository: "", digest: "", tag: "", pullPolicy: IfNotPresent}
  pullSecrets: []
secrets:
  runtime: {name: "", databaseURLKey: database-url, graphSecretKey: graph-secret}
  githubApp: {name: "", privateKeyKey: private-key.pem, webhookSecretKey: webhook-secret}
  customCA: {name: "", key: ca.crt}
  oidc: {name: "", clientSecretKey: client-secret}
  githubOAuth: {name: "", clientSecretKey: client-secret}
  oidcCA: {name: "", key: ca.crt}
  scim: {name: "", tokenKey: token}
breakGlass: {enabled: false}
server:
  replicas: 2
  port: 8080
  service: {port: 8080, annotations: {}}
  config:
    githubWebURL: https://github.example.invalid
    githubAPIURL: https://github.example.invalid/api/v3
    githubUploadURL: https://github.example.invalid/api/uploads
    githubGitURL: https://github.example.invalid
    githubAPIVersion: "2022-11-28"
    githubAppID: ""
    defaultResults: 25
    maxResults: 100
    defaultContextLines: 3
    maxContextLines: 20
    defaultTimeout: 5s
    maxTimeout: 5s
    maxRequestBytes: 65536
    maxResponseBytes: 262144
    scipMaxUploadBytes: 67108864
  sso:
    publicURL: ""
    sessionIdle: 30m
    sessionTTL: 8h
    loginFlowTTL: 10m
    oidc:
      enabled: false
      issuerURL: ""
      clientID: ""
      scopes: [openid, profile, email]
      linkClaim: ""
      displayNameClaim: name
    githubOAuth: {enabled: false, clientID: ""}
  scim: {enabled: false}
  resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  podSecurityContext: {}
  podAnnotations: {}
  pdb: {enabled: true, minAvailable: 1}
node:
  replicaCount: 1
  zoekt:
    port: 6070
    executable: /usr/local/bin/zoekt-webserver
    resources: {requests: {cpu: "2", memory: 8Gi}, limits: {cpu: "8", memory: 24Gi}}
  indexer:
    executable: /usr/local/bin/grepnest-indexer
    gitExecutable: /usr/bin/git
    zoektGitIndexExecutable: /usr/local/bin/zoekt-git-index
    minFreeBytes: 10737418240
    maxRepositoryBytes: 5368709120
    metricsPort: 9090
    resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "4", memory: 8Gi}}
  paths: {data: /data, indexes: /data/index}
  service: {port: 6070, annotations: {}}
  storage: {size: 250Gi, accessModes: [ReadWriteOnce], storageClassName: "", annotations: {}}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  podSecurityContext: {}
  podAnnotations: {}
graph:
  mode: embedded
  executable: /usr/local/bin/grepnest-graph
  port: 8081
  dataPath: /data/graph
  resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 4Gi}}
  storage: {size: 50Gi, accessModes: [ReadWriteOnce], storageClassName: "", annotations: {}}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podSecurityContext: {}
  podAnnotations: {}
scanner:
  enabled: false
  replicas: 2
  executable: /usr/local/bin/grepnest-scanner
  dataPath: /data
  gitExecutable: /usr/bin/git
  metricsPort: 9090
  resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podSecurityContext: {}
  podAnnotations: {}
migration:
  executable: /usr/local/bin/grepnest-migrate
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
  nodeSelector: {}
  affinity: {}
  tolerations: []
ingress: {enabled: false, className: "", annotations: {}, hosts: [], tls: []}
monitoring:
  serviceMonitor: {enabled: false, interval: 30s, scrapeTimeout: 10s, labels: {}, namespaceSelector: {}}
networkPolicy:
  enabled: true
  serverIngress: {ingressControllerNamespaceSelector: {}, monitoringNamespaceSelector: {}}
  externalEgress:
    enabled: false
    dns:
      namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [53]
    postgresql: {cidrs: [], port: 5432}
    github: {cidrs: [], ports: [443]}
    identityProvider: {cidrs: [], ports: [443]}

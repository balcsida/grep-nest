apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grepnest.serverName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  GREPNEST_LISTEN_ADDRESS: {{ printf ":%v" .Values.server.port | quote }}
  GREPNEST_ZOEKT_URL: {{ printf "http://%s:%v" (include "grepnest.zoektName" .) .Values.node.service.port | quote }}
  GREPNEST_GRAPH_URL: {{ printf "http://%s:%v" (include "grepnest.graphName" .) .Values.graph.port | quote }}
  GREPNEST_GRAPH_SECRET_FILE: /var/run/secrets/grepnest/graph/secret
  GREPNEST_GITHUB_WEB_URL: {{ .Values.server.config.githubWebURL | quote }}
  GREPNEST_GITHUB_API_URL: {{ .Values.server.config.githubAPIURL | quote }}
  GREPNEST_GITHUB_UPLOAD_URL: {{ .Values.server.config.githubUploadURL | quote }}
  GREPNEST_GITHUB_GIT_URL: {{ .Values.server.config.githubGitURL | quote }}
  GREPNEST_GITHUB_API_VERSION: {{ .Values.server.config.githubAPIVersion | quote }}
  GREPNEST_GITHUB_APP_ID: {{ .Values.server.config.githubAppID | quote }}
  GREPNEST_DEFAULT_RESULTS: {{ .Values.server.config.defaultResults | quote }}
  GREPNEST_MAX_RESULTS: {{ .Values.server.config.maxResults | quote }}
  GREPNEST_DEFAULT_CONTEXT_LINES: {{ .Values.server.config.defaultContextLines | quote }}
  GREPNEST_MAX_CONTEXT_LINES: {{ .Values.server.config.maxContextLines | quote }}
  GREPNEST_DEFAULT_TIMEOUT: {{ .Values.server.config.defaultTimeout | quote }}
  GREPNEST_MAX_TIMEOUT: {{ .Values.server.config.maxTimeout | quote }}
  GREPNEST_MAX_REQUEST_BYTES: {{ .Values.server.config.maxRequestBytes | quote }}
  GREPNEST_MAX_RESPONSE_BYTES: {{ .Values.server.config.maxResponseBytes | quote }}
  GREPNEST_SCIP_MAX_UPLOAD_BYTES: {{ printf "%d" (int64 .Values.server.config.scipMaxUploadBytes) | quote }}
  GREPNEST_GITHUB_PRIVATE_KEY_FILE: /var/run/secrets/grepnest/github/private-key.pem
  GREPNEST_GITHUB_WEBHOOK_SECRET_FILE: /var/run/secrets/grepnest/github/webhook-secret
  {{- if .Values.breakGlass.enabled }}
  GREPNEST_BREAK_GLASS_ENABLED: "true"
  {{- end }}
  {{- if .Values.secrets.customCA.name }}
  GREPNEST_GITHUB_CA_FILE: /var/run/secrets/grepnest/ca/ca.crt
  {{- end }}
  {{- if or .Values.server.sso.oidc.enabled .Values.server.sso.githubOAuth.enabled .Values.server.scim.enabled }}
  GREPNEST_PUBLIC_URL: {{ .Values.server.sso.publicURL | quote }}
  {{- end }}
  {{- if or .Values.server.sso.oidc.enabled .Values.server.sso.githubOAuth.enabled }}
  GREPNEST_SSO_SESSION_IDLE: {{ .Values.server.sso.sessionIdle | quote }}
  GREPNEST_SSO_SESSION_TTL: {{ .Values.server.sso.sessionTTL | quote }}
  GREPNEST_SSO_LOGIN_FLOW_TTL: {{ .Values.server.sso.loginFlowTTL | quote }}
  {{- end }}
  {{- if .Values.server.sso.oidc.enabled }}
  GREPNEST_OIDC_ISSUER_URL: {{ .Values.server.sso.oidc.issuerURL | quote }}
  GREPNEST_OIDC_CLIENT_ID: {{ .Values.server.sso.oidc.clientID | quote }}
  GREPNEST_OIDC_CLIENT_SECRET_FILE: /var/run/secrets/grepnest/oidc/client-secret
  GREPNEST_OIDC_SCOPES: {{ join "," .Values.server.sso.oidc.scopes | quote }}
  GREPNEST_OIDC_LINK_CLAIM: {{ .Values.server.sso.oidc.linkClaim | quote }}
  GREPNEST_OIDC_DISPLAY_NAME_CLAIM: {{ .Values.server.sso.oidc.displayNameClaim | quote }}
  {{- if .Values.secrets.oidcCA.name }}
  GREPNEST_OIDC_CA_FILE: /var/run/secrets/grepnest/oidc-ca/ca.crt
  {{- end }}
  {{- end }}
  {{- if .Values.server.sso.githubOAuth.enabled }}
  GREPNEST_OAUTH_GITHUB_CLIENT_ID: {{ .Values.server.sso.githubOAuth.clientID | quote }}
  GREPNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE: /var/run/secrets/grepnest/oauth-github/client-secret
  {{- end }}
  {{- if .Values.server.scim.enabled }}
  GREPNEST_SCIM_TOKEN_FILE: /var/run/secrets/grepnest/scim/token
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grepnest.nodeName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
data:
  GREPNEST_ZOEKT_URL: {{ printf "http://%s:%v" (include "grepnest.zoektName" .) .Values.node.service.port | quote }}
  GREPNEST_GITHUB_WEB_URL: {{ .Values.server.config.githubWebURL | quote }}
  GREPNEST_GITHUB_API_URL: {{ .Values.server.config.githubAPIURL | quote }}
  GREPNEST_GITHUB_UPLOAD_URL: {{ .Values.server.config.githubUploadURL | quote }}
  GREPNEST_GITHUB_GIT_URL: {{ .Values.server.config.githubGitURL | quote }}
  GREPNEST_GITHUB_API_VERSION: {{ .Values.server.config.githubAPIVersion | quote }}
  GREPNEST_GITHUB_APP_ID: {{ .Values.server.config.githubAppID | quote }}
  GREPNEST_GITHUB_PRIVATE_KEY_FILE: /var/run/secrets/grepnest/github/private-key.pem
  {{- if .Values.secrets.customCA.name }}
  GREPNEST_GITHUB_CA_FILE: /var/run/secrets/grepnest/ca/ca.crt
  {{- end }}
  GREPNEST_DATA_DIR: {{ .Values.node.paths.data | quote }}
  GREPNEST_INDEX_DIR: {{ .Values.node.paths.indexes | quote }}
  GREPNEST_GIT_PATH: {{ .Values.node.indexer.gitExecutable | quote }}
  GREPNEST_ZOEKT_GIT_INDEX: {{ .Values.node.indexer.zoektGitIndexExecutable | quote }}
  GREPNEST_MIN_FREE_BYTES: {{ printf "%d" (int64 .Values.node.indexer.minFreeBytes) | quote }}
  GREPNEST_MAX_REPOSITORY_BYTES: {{ printf "%d" (int64 .Values.node.indexer.maxRepositoryBytes) | quote }}
  GREPNEST_METRICS_LISTEN_ADDRESS: {{ printf ":%v" .Values.node.indexer.metricsPort | quote }}
  GREPNEST_GRAPH_MODE: {{ .Values.graph.mode | quote }}
  {{- if eq .Values.graph.mode "embedded" }}
  GREPNEST_GRAPH_DATA_DIR: {{ .Values.graph.dataPath | quote }}
  GREPNEST_GRAPH_LISTEN_ADDRESS: {{ printf ":%v" .Values.graph.port | quote }}
  GREPNEST_GRAPH_SECRET_FILE: /var/run/secrets/grepnest/graph/secret
  {{- end }}
{{- if .Values.scanner.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grepnest.scannerName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
data:
  GREPNEST_GITHUB_WEB_URL: {{ .Values.server.config.githubWebURL | quote }}
  GREPNEST_GITHUB_API_URL: {{ .Values.server.config.githubAPIURL | quote }}
  GREPNEST_GITHUB_UPLOAD_URL: {{ .Values.server.config.githubUploadURL | quote }}
  GREPNEST_GITHUB_GIT_URL: {{ .Values.server.config.githubGitURL | quote }}
  GREPNEST_GITHUB_API_VERSION: {{ .Values.server.config.githubAPIVersion | quote }}
  GREPNEST_GITHUB_APP_ID: {{ .Values.server.config.githubAppID | quote }}
  GREPNEST_GITHUB_PRIVATE_KEY_FILE: /var/run/secrets/grepnest/github/private-key.pem
  {{- if .Values.secrets.customCA.name }}
  GREPNEST_GITHUB_CA_FILE: /var/run/secrets/grepnest/ca/ca.crt
  {{- end }}
  GREPNEST_DATA_DIR: {{ .Values.scanner.dataPath | quote }}
  GREPNEST_GIT_PATH: {{ .Values.scanner.gitExecutable | quote }}
  GREPNEST_METRICS_LISTEN_ADDRESS: {{ printf ":%v" .Values.scanner.metricsPort | quote }}
{{- end }}
